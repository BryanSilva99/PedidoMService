name: orders-demo
services:
  orders-service:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-pedidos}?allowPublicKeyRetrieval=true&useSSL=false"
      DB_USERNAME: ${MYSQL_USER:-pedidos_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD en .env}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pedidos}
      MYSQL_USER: ${MYSQL_USER:-pedidos_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
